description: Easily install and configure the AWS CLI automatically in your jobs or commands.
usage:
  version: 2.1

  orbs:
    aws-cli: circleci/aws-cli@5.1

  jobs:
    aws-cli-example:
      executor: aws-cli/default
      steps:
        - checkout
        - aws-cli/setup:
            # In these case the aws keys are used with names by default, they must be in the context you set
            # In case your context has different names, or you are passing the values directly (not recommeded) configure these parameters
            # aws_access_key_id: $MY_KEY
            # aws_secret_access_key: $MY_SECRET
            profile_name: example # The authentication will be done to this profile
        - run: echo "Run your code here"

  workflows:
    aws-cli:
      jobs:
        - aws-cli-example:
            # The context here has AWS_ACCESS_KEY_ID and AWS_SECRET_ACCESS_KEY to be used in the setup
            context: aws
